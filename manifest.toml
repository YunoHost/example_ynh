#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "fedimodfires"
name = "FediMod FIRES"
description.en = "Share and replicate fediverse moderation recommendations and threat intelligence between servers"
description.fr = "Partager et répliquer des recommandations de modération et du renseignement sur les menaces entre serveurs du fédiverse"

version = "0.8.0~ynh1"

maintainers = ["johndoe"]

[upstream]
license = "AGPL-3.0-only"
website = "https://fires.fedimod.org"
admindoc = "https://fires.fedimod.org/manuals/reference-server/"
userdoc = "https://fires.fedimod.org/concepts/"
code = "https://github.com/fedimod/fires"
cpe = "???"
fund = "https://nlnet.nl/project/FediMod/"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

# FIRES has its own admin authentication; it does not log users in via LDAP/SSO.
ldap = false
sso = false

disk = "500M"
ram.build = "1G"
ram.runtime = "256M"

[install]
    [install.domain]
    # this is a generic question - ask strings are automatically handled by YunoHost's core
    type = "domain"

    [install.path]
    # this is a generic question - ask strings are automatically handled by YunoHost's core
    type = "path"
    default = "/"

    [install.init_main_permission]
    # FIRES exposes a public federation/replication API, so default to visitors.
    # This won't be saved as setting and will instead be used to initialize the SSOwat permission
    type = "group"
    default = "visitors"

    [install.language]
    # Maps to the FIRES DEFAULT_LOCALE environment variable (BCP-47 language tag)
    ask.en = "Default server language"
    ask.fr = "Langue par défaut du serveur"
    type = "select"
    choices = ["en", "fr"]
    default = "en"

    [install.admin]
    # this is a generic question - ask strings are automatically handled by YunoHost's core
    type = "user"

    [install.admin_email]
    # Maps to FIRES_ADMIN_USERNAME: the login of the bootstrap admin account
    ask.en = "Email address of the FIRES administrator account"
    ask.fr = "Adresse e-mail du compte administrateur FIRES"
    type = "email"

    [install.password]
    # Maps to FIRES_ADMIN_PASSWORD: the password of the bootstrap admin account.
    # FIRES only creates the initial admin when this password is longer than 16
    # characters, so require at least 17.
    # Note that user-provided passwords questions are not automatically saved as setting
    help.en = "Password for the initial FIRES administrator account (must be longer than 16 characters). It is only used to bootstrap the first admin on first boot."
    help.fr = "Mot de passe du compte administrateur FIRES initial (plus de 16 caractères). Il sert uniquement à créer le premier admin au premier démarrage."
    type = "password"
    pattern.regexp = '^.{17,}$'
    pattern.error = "The FIRES admin password must be longer than 16 characters."

[resources]
    [resources.sources.main]
    # Pre-fetched and deployed during install/upgrade with:
    #    ynh_setup_source --dest_dir="$install_dir"
    # FIRES is a monorepo; releases are tagged as `@fedimod/fires-server@X.Y.Z`.
    url = "https://github.com/fedimod/fires/archive/refs/tags/@fedimod/fires-server@0.8.0.tar.gz"
    sha256 = "198f6042f4ea735c97d461e4b5c1ae7af6b29886cb36abe1c613460bd235a334"
    autoupdate.strategy = "latest_github_tag"
    autoupdate.version_regex = '^@fedimod/fires-server@(.*)$'

    [resources.system_user]
    # This will provision/deprovision a unix system user

    [resources.install_dir]
    # This will create/remove the install dir as /var/www/$app
    # and store the corresponding setting $install_dir

    [resources.data_dir]
    # This will create/remove the data dir as /home/yunohost.app/$app
    # and store the corresponding setting $data_dir

    [resources.permissions]
    # This will configure SSOwat permission for $domain/$path/
    main.url = "/"

    [resources.ports]
    # Random internal port for reverse-proxying, stored as the $port setting.
    # FIRES (HOST=127.0.0.1, PORT=$port) is only reachable through NGINX.

    [resources.database]
    # FIRES requires PostgreSQL 17+. Provisions $db_name, $db_user, $db_pwd.
    type = "postgresql"

    [resources.nodejs]
    version = "22" # Matches the upstream Dockerfile (Node 22)
